name: PowerShell tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -MinimumVersion 6.2.0 -Scope CurrentUser -Force

      - name: Run Pester tests
        shell: pwsh
        run: Invoke-Pester -Path ./tests -CI
